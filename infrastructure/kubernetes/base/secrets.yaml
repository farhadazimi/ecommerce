# TEMPLATE ONLY - not referenced by any kustomization.
# Real values must never be committed. Create the Secret from a secure source, e.g.
#   kubectl -n ecommerce create secret generic ecommerce-secrets \
#     --from-literal=DATABASE_PASSWORD=... --from-literal=REDIS_PASSWORD=... \
#     --from-literal=OBS_ACCESS_KEY=... --from-literal=OBS_SECRET_KEY=... \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=INTERNAL_SERVICE_TOKEN="$(openssl rand -hex 24)"
# (the GitLab deploy job does exactly this from protected CI/CD variables).
# The services refuse to start while any value still contains "CHANGE_ME".
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  OBS_ACCESS_KEY: "CHANGE_ME"
  OBS_SECRET_KEY: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  INTERNAL_SERVICE_TOKEN: "CHANGE_ME"
  SMN_WEBHOOK_TOKEN: ""
