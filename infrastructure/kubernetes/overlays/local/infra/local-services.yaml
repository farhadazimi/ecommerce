# LOCAL / CI ONLY - in-cluster stand-ins for the managed services so the full stack can be
# tested on kind/minikube. In Pardis Cloud these are replaced by RDS MySQL, DCS Redis and OBS
# (never deploy these to production: they use ephemeral emptyDir storage).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/component: local-standin}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: mysql}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/component: local-standin}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
          env:
            - {name: MYSQL_DATABASE, value: ecommerce}
            - {name: MYSQL_USER, value: ecommerce_app}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: DATABASE_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: DATABASE_PASSWORD}}
          ports: [{containerPort: 3306, name: mysql}]
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uecommerce_app -p\"$MYSQL_PASSWORD\" --silent"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: run, mountPath: /var/run/mysqld}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: mysql}
spec:
  selector: {app.kubernetes.io/name: mysql}
  ports: [{port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/component: local-standin}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/component: local-standin}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy allkeys-lru"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: REDIS_PASSWORD}}
          ports: [{containerPort: 6379, name: redis}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-storage
  labels: {app.kubernetes.io/name: object-storage, app.kubernetes.io/component: local-standin}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: object-storage}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: object-storage, app.kubernetes.io/component: local-standin}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          command: ["/usr/bin/weed", "-logtostderr=true", "mini", "-dir=/data"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: OBS_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: OBS_SECRET_KEY}}
          ports: [{containerPort: 8333, name: s3}]
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: data, emptyDir: {}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: object-storage}
spec:
  selector: {app.kubernetes.io/name: object-storage}
  ports: [{port: 8333, targetPort: s3}]
---
# Browsers fetch pre-signed URLs from "OBS" directly (like the real OBS endpoint).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: object-storage
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
spec:
  ingressClassName: nginx
  rules:
    - host: objects.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: object-storage, port: {number: 8333}}}
---
# Local stand-ins accept connections from the app pods and the ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-local-standins}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: local-standin}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: ecommerce}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
