[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-common"
version = "1.0.0"
description = "Shared building blocks (config, models, adapters, observability) for the Plan B e-commerce services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "SQLAlchemy>=2.0.30,<2.1",
    "PyMySQL>=1.1,<2",
    "cryptography>=42",
    "redis>=5.0,<6",
    "boto3>=1.34,<2",
    "PyJWT>=2.8,<3",
    "bcrypt>=4.1,<5",
    "prometheus-client>=0.20,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecommerce_common*"]
